name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deploy gleichzeitig; laufende nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # enablement: true legt die Pages-Site an, falls es sie noch nicht gibt.
      # Ohne das bricht dieser Schritt bei einem frischen Repo nach ~10 s ab
      # ("Get Pages site failed") und Upload/Deploy werden uebersprungen.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # 15 statt 10 Minuten: sonst killt der Runner den Schritt genau dann, wenn die
      # Action selbst abbricht - dadurch fehlt im Log die aussagekraeftige Meldung.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
